<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c2340"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5555"/>
      <stop offset="100%" style="stop-color:#cc2222"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  
  <!-- Red Button -->
  <circle cx="256" cy="256" r="140" fill="url(#btn)"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  
  <!-- Pulse ring (static representation) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#e3342f" stroke-width="3" opacity="0.3"/>
  
  <!-- Text -->
  <text x="256" y="240" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">HDMI</text>
  <text x="256" y="290" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="600">WORX</text>
</svg>
